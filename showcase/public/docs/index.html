<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>文档 · 叙界 Scriverse</title>
  <meta name="description" content="叙界产品文档目录。">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root {
      --ink: #25231f;
      --muted: #746f65;
      --paper: #f7f4ed;
      --line: #d9d2c5;
      --accent: #8b3d2c;
      --accent-dark: #6e2e21;
      --surface: #fffefa;
      --font-latin: "SFMono-Regular", "SF Mono", Menlo, Monaco, Consolas, monospace;
      --font-cjk: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", "Heiti SC", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: radial-gradient(circle at 12% 0, rgba(139, 61, 44, .08), transparent 28%), var(--paper);
      font-family: var(--font-cjk);
      line-height: 1.7;
    }
    a { color: var(--accent-dark); text-decoration: none; }
    a:hover { color: var(--accent); }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 64px;
      padding: 0 clamp(20px, 5vw, 72px);
      border-bottom: 1px solid rgba(217, 210, 197, .82);
      background: rgba(247, 244, 237, .9);
      backdrop-filter: blur(16px);
    }
    .brand { display: inline-flex; align-items: center; gap: 10px; color: inherit; }
    .brand-mark {
      display: grid; width: 32px; height: 32px; place-items: center;
      border-radius: 3px; color: #fff; background: var(--accent); font-weight: 700;
    }
    .brand strong, .brand small { display: block; }
    .brand strong { font-size: 14px; letter-spacing: .16em; }
    .brand small { margin-top: 1px; color: var(--muted); font-family: var(--font-latin); font-size: 8px; letter-spacing: .14em; }
    main { max-width: 820px; margin: 0 auto; padding: 56px clamp(20px, 5vw, 40px) 96px; }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 10px; color: var(--accent);
      font-family: var(--font-latin); font-size: 10px; font-weight: 650; letter-spacing: .14em;
    }
    .eyebrow::before { width: 22px; height: 1px; background: currentColor; content: ""; }
    h1 { margin: 18px 0 14px; font-size: clamp(32px, 5vw, 42px); font-weight: 560; letter-spacing: -.04em; }
    .lede { margin: 0 0 32px; color: #5f5950; }
    .doc-list { display: grid; gap: 12px; margin: 0; padding: 0; list-style: none; }
    .doc-list a {
      display: grid; gap: 6px; padding: 18px 18px 16px;
      border: 1px solid var(--line); border-radius: 8px; background: var(--surface);
      box-shadow: 0 10px 24px rgba(49, 42, 32, .04); color: inherit;
    }
    .doc-list a:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
    .doc-list strong { font-size: 16px; }
    .doc-list span { color: var(--muted); font-size: 13px; line-height: 1.65; }
    .doc-list small { color: var(--accent); font-family: var(--font-latin); font-size: 11px; }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">
      <span class="brand-mark" aria-hidden="true">叙</span>
      <span><strong>叙界</strong><small>SCRIVERSE DOCS</small></span>
    </a>
    <a href="/">返回介绍页</a>
  </header>
  <main>
    <span class="eyebrow">DOCUMENTATION</span>
    <h1>产品文档</h1>
    <p class="lede">说明叙界设置项与安全机制的用途，方便在本地部署中对照配置。</p>
    <ul class="doc-list">
      <li>
        <a href="/docs/global-tool-call-limit.html">
          <small>/docs/global-tool-call-limit</small>
          <strong>全局工具调用限制</strong>
          <span>解释调用上限、Compact 后的配额放宽，以及全局倍数如何熔断工具死循环。</span>
        </a>
      </li>
    </ul>
  </main>
</body>
</html>
